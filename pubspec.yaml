name: mpvson
description: A modern desktop video player for Windows and Linux, powered by mpv.

# Private package; never published.
publish_to: 'none'

version: 0.1.2+3
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Keep the media_kit bindings and renderer pinned while updating libmpv
  # independently.
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  media_kit_libs_windows_video: 1.0.11
  window_manager: ^0.5.2
  file_selector: ^1.1.0
  desktop_drop: ^0.7.0
  path_provider: ^2.1.5
  package_info_plus: ^10.2.2
  path: ^1.9.1
  meta: ^1.18.0
  http: ^1.5.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  archive: ^4.5.2
  url_launcher: ^6.3.2
  sqlite3: 3.7.1
  watcher: 1.2.1
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

dependency_overrides:
  media_kit:
    path: packages/media_kit
  media_kit_video:
    path: packages/media_kit_video
  meta: 1.18.0

flutter:
  # Material Icons are used throughout the UI.
  uses-material-design: true
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 400
        - asset: assets/fonts/Onest-Variable.ttf
          weight: 600
