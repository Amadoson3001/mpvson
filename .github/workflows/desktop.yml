name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_manifest:
        description: HTTPS release manifest URL, optional for development builds
        type: string
        required: false
      engine_manifest:
        description: HTTPS signed Windows engine manifest URL, optional
        type: string
        required: false
      engine_public_key:
        description: Base64 Ed25519 public key for the Windows engine feed
        type: string
        required: false

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.18.0
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libasound2-dev libepoxy-dev liblzma-dev jq
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib tool
      - run: flutter analyze
      - name: Build Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UPDATE_MANIFEST: ${{ inputs.update_manifest }}
          ENGINE_MANIFEST: ${{ inputs.engine_manifest }}
          ENGINE_PUBLIC_KEY: ${{ inputs.engine_public_key }}
        run: flutter build windows --release "--dart-define=MPVSON_UPDATE_MANIFEST=$env:UPDATE_MANIFEST" "--dart-define=MPVSON_ENGINE_UPDATE_MANIFEST=$env:ENGINE_MANIFEST" "--dart-define=MPVSON_ENGINE_PUBLIC_KEY=$env:ENGINE_PUBLIC_KEY"
      - name: Build Linux release
        if: runner.os == 'Linux'
        env:
          UPDATE_MANIFEST: ${{ inputs.update_manifest }}
        run: flutter build linux --release --dart-define="MPVSON_UPDATE_MANIFEST=$UPDATE_MANIFEST"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dart run tool/engine_provenance.dart verify
          dart run tool/engine_provenance.dart inventory
          Copy-Item build/windows/x64/engine/engine-inventory.json build/windows/x64/runner/Release/engine-inventory.json
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/mpvson-windows-x64.zip -Force
          $packageHash = (Get-FileHash dist/mpvson-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$packageHash  mpvson-windows-x64.zip" | Set-Content dist/SHA256SUMS -Encoding ascii
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp packaging/linux/dev.mpvson.mpvson.desktop build/linux/x64/release/bundle/
          cp packaging/linux/dev.mpvson.mpvson.svg build/linux/x64/release/bundle/
          tar -C build/linux/x64/release/bundle -czf dist/mpvson-linux-x64.tar.gz .
          (cd dist && sha256sum mpvson-linux-x64.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mpvson-${{ runner.os }}-x64
          path: dist/*
