name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for manual runs, e.g. v0.1.0)
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.18.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libasound2-dev libepoxy-dev liblzma-dev jq

      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib tool test
      - run: dart run tool/version.dart check
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --no-pub test/

      - name: Verify tag matches pubspec version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PUB_VER=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          if [ "$TAG" != "v$PUB_VER" ]; then
            echo "Tag $TAG does not match pubspec.yaml version $PUB_VER"
            exit 1
          fi

      - name: Build Windows release & installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dart run tool/setup_windows_build.dart
          flutter build windows --release --tree-shake-icons --obfuscate --split-debug-info=build/debug-info --target=lib/main.dart
          $rel = 'build/windows/x64/runner/Release'
          if (Test-Path "$rel/zlib.dll") { Remove-Item "$rel/zlib.dll" -Force }
          if (Test-Path "$rel/vk_swiftshader.dll") { Remove-Item "$rel/vk_swiftshader.dll" -Force }
          $signedDlls = @('flutter_windows.dll', 'd3dcompiler_47.dll', 'vulkan-1.dll', 'libEGL.dll', 'libGLESv2.dll', 'libmpv-2.dll')
          $stripDlls = Get-ChildItem "$rel/*.dll" -ErrorAction SilentlyContinue |
            Where-Object {
              $signedDlls -notcontains $_.Name -and $_.Name -notmatch '^(msvcp|vcruntime|concrt|vccorlib).*\.dll$'
            }
          foreach ($dll in $stripDlls) {
            if (Get-Command llvm-strip -ErrorAction SilentlyContinue) {
              llvm-strip --strip-all $dll.FullName
            } elseif (Get-Command strip -ErrorAction SilentlyContinue) {
              strip --strip-all $dll.FullName
            }
          }
          dart run tool/engine_provenance.dart verify
          dart run tool/engine_provenance.dart inventory
          Copy-Item build/windows/x64/engine/engine-inventory.json "$rel/engine-inventory.json" -Force
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "$rel/*" -DestinationPath dist/mpvson-windows-x64.zip -Force
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction Stop).Source }
          & $iscc packaging\windows\installer.iss
          Copy-Item build/windows/installer/MpvsonSetup.exe dist/MpvsonSetup.exe -Force

      - name: Build & package Linux release
        if: runner.os == 'Linux'
        run: |
          flutter build linux --release --target=lib/main.dart
          mkdir -p dist
          cp packaging/linux/dev.mpvson.mpvson.desktop build/linux/x64/release/bundle/
          cp packaging/linux/dev.mpvson.mpvson.svg build/linux/x64/release/bundle/
          cp packaging/linux/install.sh build/linux/x64/release/bundle/
          cp packaging/linux/uninstall.sh build/linux/x64/release/bundle/
          tar -C build/linux/x64/release/bundle -czf dist/mpvson-linux-x64.tar.gz .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ runner.os }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.18.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Assemble release assets, checksums, and update manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          cp artifacts/dist-Windows/* release-assets/
          cp artifacts/dist-Linux/* release-assets/
          dart run tool/create_checksums.dart release-assets
          dart run tool/create_checksums.dart release-assets --verify
          APP_VER=$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)
          ENG_VER=$(node -e "console.log(require('./packaging/windows/engine-provenance.json').engine.runtimeVersion)")
          REPO_URL="https://github.com/${{ github.repository }}"
          dart run tool/create_release_manifest.dart \
            --version "$APP_VER" \
            --engine-version "$ENG_VER" \
            --release-url "$REPO_URL/releases/tag/$TAG" \
            --windows-file release-assets/MpvsonSetup.exe \
            --windows-url "$REPO_URL/releases/download/$TAG/MpvsonSetup.exe" \
            --windows-portable-file release-assets/mpvson-windows-x64.zip \
            --windows-portable-url "$REPO_URL/releases/download/$TAG/mpvson-windows-x64.zip" \
            --linux-file release-assets/mpvson-linux-x64.tar.gz \
            --linux-url "$REPO_URL/releases/download/$TAG/mpvson-linux-x64.tar.gz" \
            --notes "Mpvson $APP_VER" \
            --verify-bundle \
            --output release-assets/update-manifest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "Mpvson $TAG" \
            --generate-notes \
            --verify-tag
